<div class="login-container">
  <div class="login-card">
    <div class="card">
      <div class="card-header">
        <h3 class="text-center">Sistema Magnum</h3>
      </div>
      <div class="card-body">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              formControlName="email"
              [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
              placeholder="usuario@ejemplo.com"
            >
            <div class="invalid-feedback" *ngIf="loginForm.get('email')?.errors?.['required']">
              Email es requerido
            </div>
            <div class="invalid-feedback" *ngIf="loginForm.get('email')?.errors?.['email']">
              Email no válido
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="password"
              formControlName="password"
              [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
              placeholder="••••••"
            >
            <div class="invalid-feedback" *ngIf="loginForm.get('password')?.errors?.['required']">
              Contraseña es requerida
            </div>
            <div class="invalid-feedback" *ngIf="loginForm.get('password')?.errors?.['minlength']">
              Mínimo 6 caracteres
            </div>
          </div>

          <div class="d-grid">
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="loginForm.invalid || loading"
            >
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              {{ loading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
            </button>
          </div>

          <div *ngIf="error" class="alert alert-danger mt-3">
            {{ error }}
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
